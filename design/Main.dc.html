<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
    a { color: #0f4c81; text-decoration: none; }
    a:hover { color: #0a3557; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: linear-gradient(180deg, {{topColor}} 0%, {{midColor}} 46%, {{bottomColor}} 100%); display: flex; flex-direction: column; gap: 0; padding: 0 0 28px 0;">

  <!-- top bar -->
  <div style="display: flex; justify-content: flex-end; align-items: center; padding: 18px 18px 0 18px;">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3"></path>
        <path d="m8 7 4-4 4 4"></path>
        <path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path>
      </svg>
    </div>
  </div>

  <!-- header -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 24px 0 24px;">
    <span style="font-family: 'Caveat', ui-serif, cursive; font-size: 26px; line-height: 1; color: rgba(255,255,255,0.92); transform: rotate(-4deg);">Hello,</span>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; color: #ffffff; text-transform: uppercase;">Let&#39;s Connect</h1>
  </div>

  <!-- avatar -->
  <div style="display: flex; justify-content: center; padding: 20px 0 0 0;">
    <div style="width: 104px; height: 104px; border-radius: 999px; background: #f4e3d2; border: 4px solid rgba(255,255,255,0.85); box-shadow: 0 10px 26px rgba(6, 32, 74, 0.28); overflow: hidden; display: flex; align-items: flex-end; justify-content: center;">
      <!-- placeholder avatar -->
      <svg width="104" height="104" viewBox="0 0 104 104" fill="none">
        <rect width="104" height="104" fill="#e8623a"></rect>
        <circle cx="52" cy="40" r="21" fill="#f3d0b4"></circle>
        <path d="M31 40c0-12 9-21 21-21s21 9 21 21c0-6-4-9-10-10-5-1-9-4-11-7-3 4-8 8-14 9-4 1-7 3-7 8Z" fill="#20242c"></path>
        <path d="M22 104c0-17 13-28 30-28s30 11 30 28H22Z" fill="#1c2b52"></path>
      </svg>
    </div>
  </div>

  <!-- name + socials -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 24px 0 24px;">
    <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; color: #ffffff;">syafar.dev</h2>
    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.4" cy="6.6" r="1.1" fill="#ffffff" stroke="none"></circle>
        </svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path>
        </svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <path d="M8 11v6"></path>
          <path d="M8 7.6v.1"></path>
          <path d="M12.5 17v-3.4a2.1 2.1 0 0 1 4.2 0V17"></path>
          <path d="M12.5 11v6"></path>
        </svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h3.6l5 6.7L18.2 4H21l-7 8.2L21.4 20h-3.6l-5.3-7-6 7H4l7.4-8.6L4 4Z"></path>
        </svg>
      </div>
    </div>
  </div>

  <!-- links -->
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 18px 0 18px;">

    <!-- featured card -->
    <div style="background: {{cardColor}}; border-radius: 22px; padding: 10px 10px 0 10px; box-shadow: 0 12px 28px rgba(6, 32, 74, 0.18); display: flex; flex-direction: column; gap: 0;">
      <div style="border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 11; background: #2f3a4d; display: flex; align-items: center; justify-content: center;">
        <!-- placeholder cover -->
        <svg width="100%" height="100%" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" fill="none">
          <rect width="320" height="220" fill="#3a4759"></rect>
          <rect x="0" y="150" width="320" height="70" fill="#2b3646"></rect>
          <circle cx="160" cy="104" r="34" fill="#586a80"></circle>
          <path d="M148 118v-28l24 14-24 14Z" fill="#cfe3f6"></path>
          <text x="160" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#93a8c0">[YOUR COVER IMAGE]</text>
        </svg>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 6px 14px 6px;">
        <span style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 700; color: #10345c;">Instagram</span>
        <div style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#10345c">
            <circle cx="12" cy="5" r="1.7"></circle>
            <circle cx="12" cy="12" r="1.7"></circle>
            <circle cx="12" cy="19" r="1.7"></circle>
          </svg>
        </div>
      </div>
    </div>

    <!-- compact cards -->
    <div style="background: {{cardColor}}; border-radius: 20px; padding: 10px; box-shadow: 0 10px 22px rgba(6, 32, 74, 0.16); display: flex; align-items: center; gap: 12px; min-height: 44px;">
      <div style="width: 52px; height: 52px; border-radius: 12px; overflow: hidden; flex-shrink: 0;">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <rect width="52" height="52" fill="#1f4e8c"></rect>
          <rect x="10" y="14" width="20" height="26" rx="3" fill="#8fc0f0"></rect>
          <rect x="32" y="20" width="12" height="20" rx="3" fill="#d7e9fb"></rect>
        </svg>
      </div>
      <span style="flex-grow: 1; font-size: 14px; font-weight: 700; color: #10345c;">Syafaruddin — Software Engineer</span>
      <div style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#10345c">
          <circle cx="12" cy="5" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="12" cy="19" r="1.7"></circle>
        </svg>
      </div>
    </div>

    <div style="background: {{cardColor}}; border-radius: 20px; padding: 10px; box-shadow: 0 10px 22px rgba(6, 32, 74, 0.16); display: flex; align-items: center; gap: 12px; min-height: 44px;">
      <div style="width: 52px; height: 52px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: #0d1117; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path>
        </svg>
      </div>
      <span style="flex-grow: 1; font-size: 14px; font-weight: 700; color: #10345c;">GitHub — Open Source Projects</span>
      <div style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#10345c">
          <circle cx="12" cy="5" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="12" cy="19" r="1.7"></circle>
        </svg>
      </div>
    </div>

  </div>

  <!-- footer -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 40px 24px 0 24px;">
    <span style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7);">© 2026 syafar.dev</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "topColor": {"editor": "color", "default": "#1f3fa6", "section": "Theme"},
  "midColor": {"editor": "color", "default": "#1479c9", "section": "Theme"},
  "bottomColor": {"editor": "color", "default": "#2aa6dd", "section": "Theme"},
  "cardColor": {"editor": "color", "default": "#cfe7fa", "section": "Theme"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      topColor: this.props.topColor ?? '#1f3fa6',
      midColor: this.props.midColor ?? '#1479c9',
      bottomColor: this.props.bottomColor ?? '#2aa6dd',
      cardColor: this.props.cardColor ?? '#cfe7fa'
    };
  }
}
</script>
</body>
</html>
